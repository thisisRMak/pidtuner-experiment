name: Build desktop executables

# IMPORTANT: this file must live at  REPO/.github/workflows/build.yml
# (repo root). The application code lives in the REPO/pidtuner/ subfolder, so
# every build/test/package step runs with working-directory: pidtuner, and the
# finished .zip is written up to the repo root so the upload/release steps
# (which are root-relative) can find it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write            # needed to create/attach Releases on tags

defaults:
  run:
    working-directory: pidtuner   # all `run:` steps execute inside pidtuner/

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: PIDTuner-windows.zip
          - os: macos-13          # Intel
            asset: PIDTuner-macos-intel.zip
          - os: macos-14          # Apple Silicon
            asset: PIDTuner-macos-arm64.zip
          - os: ubuntu-22.04
            asset: PIDTuner-linux.zip

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4         # clones to repo root (GITHUB_WORKSPACE)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk runtime (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pyinstaller

      - name: Sanity-check the test suite
        run: python test_pid_tuner.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean pidtuner.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/PIDTuner/* -DestinationPath "$env:GITHUB_WORKSPACE/${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ -d "PIDTuner.app" ]; then
            zip -r "$GITHUB_WORKSPACE/${{ matrix.asset }}" PIDTuner.app
          else
            zip -r "$GITHUB_WORKSPACE/${{ matrix.asset }}" PIDTuner
          fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r "$GITHUB_WORKSPACE/${{ matrix.asset }}" PIDTuner

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}       # root-relative; the zip was written there
          retention-days: 30

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
