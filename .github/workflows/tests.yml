name: Tests

# Runs the full pytest suite (PID + LQR/LQG tracks, CLI/GUI/supervisor
# coverage) on every push and PR targeting main. Separate from build.yml,
# which builds/packages the desktop executables and only runs on a
# version tag or manual dispatch.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (full suite, serial)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt -r src/requirements-dev.txt

      - name: Run test suite
        run: pytest
